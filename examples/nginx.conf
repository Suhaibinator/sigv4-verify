load_module /etc/nginx/modules/ngx_http_sigv4_verify_module.so;

events {}

http {
    proxy_cache_path /var/cache/nginx/s3
        levels=1:2
        keys_zone=s3_assets:10m
        max_size=10g
        inactive=60m
        use_temp_path=off;

    upstream minio_origin {
        # Replace with the address of your S3-compatible origin.
        server 127.0.0.1:9000;
        keepalive 32;
    }

    sigv4_verify_clock_skew 5m;
    sigv4_verify_default_max_expires 15m;
    sigv4_verify_methods GET HEAD;
    sigv4_verify_log_denies on;

    sigv4_verify_credential minio_public_reader
        secret_key_file=/run/secrets/sigv4
        enabled=on
        max_expires=10m
        allowed_host=assets.example.com
        allowed_method=GET
        allowed_method=HEAD
        allowed_prefix=/my-bucket/public/;

    log_format sigv4 '$remote_addr "$request" $status '
                     'sigv4_result=$sigv4_verify_result '
                     'sigv4_reason=$sigv4_verify_reason '
                     'sigv4_key=$sigv4_verify_access_key_hash '
                     'sigv4_us=$sigv4_verify_latency_us';

    server {
        listen 8080;
        server_name assets.example.com;

        access_log /var/log/nginx/sigv4.log sigv4;

        location / {
            sigv4_verify on;

            proxy_pass http://minio_origin;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_cache s3_assets;
            proxy_cache_methods GET HEAD;
            # Preserve the complete signed query in the cache identity.
            proxy_cache_key "$scheme://$host$request_uri";
            proxy_cache_valid 200 206 10m;

            proxy_connect_timeout 1s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }
    }
}
