version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/rust/sigv4-verifier/fuzz"
    schedule:
      interval: weekly
    groups:
      fuzz-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/build/nginx-module"
    schedule:
      interval: weekly
    groups:
      container-images:
        patterns:
          - "*"
